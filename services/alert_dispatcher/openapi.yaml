openapi: 3.0.3
info:
  title: Alert Dispatcher API
  version: 1.0.0
  description: Minimal API for listing and updating webhook status.
servers:
  - url: /
paths:
  /webhooks:
    get:
      summary: List webhooks
      description: Return all seeded webhook rows.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    target_url:
                      type: string
                    status:
                      type: integer
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
                  required:
                    - id
                    - name
                    - target_url
                    - status
                    - created_at
                    - updated_at

  /webhooks/{id}:
    put:
      summary: Update webhook status
      description: Update only the status field of one webhook.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Webhook id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  enum: [0, 1]
                  description: 0 = active, 1 = inactive
              required:
                - status
              additionalProperties: false
            examples:
              activate:
                value:
                  status: 0
              deactivate:
                value:
                  status: 1
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  target_url:
                    type: string
                  status:
                    type: integer
                    enum: [0, 1]
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                required:
                  - id
                  - name
                  - target_url
                  - status
                  - created_at
                  - updated_at
        '400':
          description: Invalid request body or invalid status value
        '404':
          description: Webhook not found
