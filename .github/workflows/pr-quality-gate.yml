name: PR Quality Gate

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-and-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyLint (min score 9/10)
        run: |
          pylint src --fail-under=9.0

      - name: Run tests with coverage (min 96% for src)
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=96 | tee coverage.txt

      - name: Comment coverage on PR (only on failure)
        if: failure()
        uses: actions/github-script@v7
        env:
          COVERAGE_FILE: coverage.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-report -->';
            let body;

            try {
              const content = fs.readFileSync(process.env.COVERAGE_FILE, 'utf8');
              const match = content.match(/TOTAL\s+\d+\s+\d+\s+(\d+%)/);
              const coverage = match ? match[1] : 'N/A';
              body = `${marker}\n## Test Coverage\n- Coverage (src): **${coverage}**\n- Required: **>= 96%**`;
            } catch (error) {
              body = `${marker}\n## Test Coverage\nKhong doc duoc file coverage.txt de tao bao cao coverage.`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
