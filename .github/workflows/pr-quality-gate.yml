name: PR Quality Gate

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-and-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Check client formatting
        working-directory: client
        run: npm run format:check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyLint (min score 9/10)
        run: |
          pylint src services/alert_dispatcher --fail-under=9.0

      - name: Run tests with coverage (min 96% for src)
        run: |
          set -o pipefail
          pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage-src.xml --cov-fail-under=96 | tee coverage-src.txt

      - name: Run tests with coverage (min 96% for services/alert_dispatcher)
        run: |
          set -o pipefail
          pytest --cov=services/alert_dispatcher --cov-report=term-missing --cov-report=xml:coverage-alert-dispatcher.xml --cov-fail-under=96 | tee coverage-alert-dispatcher.txt

      - name: Comment coverage on PR (only on failure)
        if: failure()
        uses: actions/github-script@v7
        env:
          COVERAGE_SRC_FILE: coverage-src.txt
          COVERAGE_ALERT_DISPATCHER_FILE: coverage-alert-dispatcher.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-report -->';
            let body;

            try {
              const srcContent = fs.readFileSync(process.env.COVERAGE_SRC_FILE, 'utf8');
              const srcMatch = srcContent.match(/TOTAL\s+\d+\s+\d+\s+(\d+%)/);
              const srcCoverage = srcMatch ? srcMatch[1] : 'N/A';

              const alertDispatcherContent = fs.readFileSync(process.env.COVERAGE_ALERT_DISPATCHER_FILE, 'utf8');
              const alertDispatcherMatch = alertDispatcherContent.match(/TOTAL\s+\d+\s+\d+\s+(\d+%)/);
              const alertDispatcherCoverage = alertDispatcherMatch ? alertDispatcherMatch[1] : 'N/A';

              body = `${marker}\n## Test Coverage\n- Coverage (src): **${srcCoverage}**\n- Coverage (services/alert_dispatcher): **${alertDispatcherCoverage}**\n- Required: **>= 96%** for each scope`;
            } catch (error) {
              body = `${marker}\n## Test Coverage\nUnable to read the coverage report file to generate a coverage report.`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
