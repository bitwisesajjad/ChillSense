services:
  postgres-db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coldchain
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432
  api:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=1
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=coldchain
      - POSTGRES_HOST=postgres-db
      - FLASK_APP=src:create_app
    command: flask --app src:create_app run --host=0.0.0.0 --port=5000
    ports:
      - "5001:5000"
    depends_on:
      - postgres-db

  mock-sensor:
    build:
      context: ./mock-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MOCK_API_HOST=http://api:5000
      - MOCK_SHIPMENT_ID=1
      - MOCK_INTERVAL_SECONDS=18
      - MOCK_ALERT_EVERY=3
      - MOCK_MAX_RETRIES=4
      - MOCK_BACKOFF_SECONDS=1
    depends_on:
      - api
