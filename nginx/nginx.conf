events {}

http {
  server {
    listen 80;

    # Serve a blank page with a TODO message for root
    location = / {
      default_type text/html;
      return 200 "<html><body><div>TODO: Serve static files or React app here.</div></body></html>";
    }

    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_redirect off;

      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header X-Real-IP $remote_addr; # If you don’t care about logging or using the real client IP in Flask, you can omit this line.

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';

      proxy_pass http://api:5000;
    }
  }
}
