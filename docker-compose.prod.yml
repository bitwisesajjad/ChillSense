services:
  postgres-db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coldchain
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      # - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      target: prod
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=coldchain
      - POSTGRES_HOST=postgres-db
      - FLASK_APP=src:create_app
      - GUNICORN_WORKERS=3
    command: sh -c 'python3 db_init.py && gunicorn -w ${GUNICORN_WORKERS:-3} -b 0.0.0.0:5000 --access-logfile - "src:create_app()"'
    expose:
      - "5000"
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  alert-dispatcher:
    build:
      context: ./services/alert_dispatcher
      dockerfile: Dockerfile
    volumes:
      - ./services/alert_dispatcher:/app/services/alert_dispatcher
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
      - FLASK_APP=services.alert_dispatcher:create_app
      - CHILLSENSE_BASE_URL=http://api:5000
      - ALERT_DISPATCHER_BASE_URL=http://alert-dispatcher:5002
      - REQUEST_TIMEOUT_SECONDS=5
      - POLL_INTERVAL_SECONDS=20
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    command: >
      sh -c "python3 -m services.alert_dispatcher.init_db &&
      python3 -m services.alert_dispatcher.poller &
      flask --app services.alert_dispatcher:create_app run --host=0.0.0.0 --port=5002"
    expose:
      - "5002"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: python:3.11-alpine
    restart: unless-stopped
    working_dir: /srv
    volumes:
      - ./client:/srv:ro
    command: python -m http.server 8080
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5001:80"
    depends_on:
      api:
        condition: service_healthy
      alert-dispatcher:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
