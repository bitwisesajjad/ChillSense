services:
  postgres-db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coldchain
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432

  api:
    build:
      context: .
      target: prod
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=coldchain
      - POSTGRES_HOST=postgres-db
      - FLASK_APP=src:create_app
      - GUNICORN_WORKERS=3
    command: sh -c 'gunicorn -w ${GUNICORN_WORKERS:-3} -b 0.0.0.0:5000 --access-logfile - "src:create_app()"'
    ports:
      - "5001:5000"
    depends_on:
      - postgres-db
