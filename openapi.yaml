---
openapi: 3.0.3
info:
  title: ChillSense API
  version: "1.0"
  description: API for managing shipments, readings and alerts.

servers:
  - url: http://localhost:5001/api

tags:
  - name: Shipments
  - name: Readings
  - name: Alerts

paths:

  /shipments:
    get:
      tags: [Shipments]
      summary: Get shipments
      description: Get all shipments.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
              example:
                - id: 1
                  name: S1
                  origin: Oulu
                  destination: Helsinki
                  status: active
                  min_temperature: -10
                  max_temperature: 5
                  created_at: "2026-03-29 10:00:00"
                - id: 2
                  name: S2
                  origin: Tampere
                  destination: Helsinki
                  status: delivered
                  min_temperature: -25
                  max_temperature: -18
                  created_at: "2026-03-30 08:00:00"

    post:
      tags: [Shipments]
      summary: Create shipment
      description: Create a new shipment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
            example:
              name: S1
              origin: Oulu
              destination: Helsinki
              status: active
              min_temperature: -10
              max_temperature: 5
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created shipment
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
              example:
                id: 1
                name: S1
                origin: Oulu
                destination: Helsinki
                status: active
                min_temperature: -10
                max_temperature: 5
                created_at: "2026-03-29 10:00:00"
        "400":
          description: Bad request
        "409":
          description: Conflict
        "415":
          description: Invalid content type

  /shipments/{shipmentId}:
    parameters:
      - $ref: "#/components/parameters/ShipmentId"

    get:
      tags: [Shipments]
      summary: Get shipment
      description: Get a shipment by id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentWithLinks"
              example:
                id: 1
                name: S1
                origin: Oulu
                destination: Helsinki
                status: active
                min_temperature: -10
                max_temperature: 5
                created_at: "2026-03-29 10:00:00"
                _links:
                  self: /api/shipments/1
                  readings: /api/shipments/1/readings
        "404":
          description: Not found

    put:
      tags: [Shipments]
      summary: Update shipment
      description: Update shipment. Returns the updated shipment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
            example:
              name: S1-updated
              origin: Oulu
              destination: Tampere
              status: active
              min_temperature: -20
              max_temperature: 2
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
              example:
                id: 1
                name: S1-updated
                origin: Oulu
                destination: Tampere
                status: active
                min_temperature: -20
                max_temperature: 2
                created_at: "2026-03-29 10:00:00"
        "400":
          description: Bad request
        "404":
          description: Not found
        "409":
          description: Conflict
        "415":
          description: Invalid content type

    delete:
      tags: [Shipments]
      summary: Delete shipment
      description: Delete a shipment (admin only).
      security:
        - ApiKeyAuth: []
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /shipments/{shipmentId}/readings:
    parameters:
      - $ref: "#/components/parameters/ShipmentId"

    get:
      tags: [Readings]
      summary: Get readings
      description: Get all readings for a shipment.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reading"
              example:
                - id: 1
                  temp: -5.2
                  humidity: 60.0
                  shipment_id: 1
                  ts: "2026-03-29 10:05:00"
                - id: 2
                  temp: 8.1
                  humidity: null
                  shipment_id: 1
                  ts: "2026-03-29 10:10:00"
        "404":
          description: Not found

    post:
      tags: [Readings]
      summary: Create reading
      description: >
        Add a reading to a shipment. If the temperature is outside the shipment's
        allowed range, an alert is also created and returned alongside the reading.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingInput"
            example:
              temp: 10
              humidity: 30
      responses:
        "201":
          description: Created. Returns a list with the reading and alert (if triggered).
          headers:
            Location:
              description: URL of the created reading
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingPostResponse"
              examples:
                with_alert:
                  summary: Reading that triggered an alert
                  value:
                    - id: 3
                      temp: 10.0
                      humidity: 30.0
                      shipment_id: 1
                      ts: "2026-03-29 10:15:00"
                    - id: 1
                      msg: "Temperature 10.0C is out of range [-10, 5]"
                      severity: warning
                      is_resolved: false
                      shipment_id: 1
                      reading_id: 3
                      created_at: "2026-03-29 10:15:00"
                without_alert:
                  summary: Reading within acceptable range (no alert)
                  value:
                    - id: 4
                      temp: 0.0
                      humidity: 55.0
                      shipment_id: 1
                      ts: "2026-03-29 10:20:00"
                    - null
        "400":
          description: Bad request
        "404":
          description: Not found
        "415":
          description: Invalid content type

  /shipments/{shipmentId}/readings/{readingId}:
    parameters:
      - $ref: "#/components/parameters/ShipmentId"
      - $ref: "#/components/parameters/ReadingId"

    get:
      tags: [Readings]
      summary: Get reading
      description: Get a reading by id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingWithLinks"
              example:
                id: 1
                temp: -5.2
                humidity: 60.0
                shipment_id: 1
                ts: "2026-03-29 10:05:00"
                _links:
                  self: /api/shipments/1/readings/1
                  shipment: /api/shipments/1
        "404":
          description: Not found

  /alerts:
    get:
      tags: [Alerts]
      summary: Get all alerts
      description: Get alerts across all shipments.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
              examples:
                mixed_shipments:
                  summary: Alerts from multiple shipments
                  value:
                    - id: 1
                      msg: "Temperature 10.0C is out of range [-10, 5]"
                      severity: warning
                      is_resolved: false
                      shipment_id: 1
                      reading_id: 3
                      created_at: "2026-03-29 10:15:00"
                    - id: 2
                      msg: "Temperature -30.0C is out of range [-25, -18]"
                      severity: warning
                      is_resolved: false
                      shipment_id: 2
                      reading_id: 4
                      created_at: "2026-03-30 08:12:00"

  /shipments/{shipmentId}/alerts:
    parameters:
      - $ref: "#/components/parameters/ShipmentId"

    get:
      tags: [Alerts]
      summary: Get alerts
      description: Get all alerts for a shipment.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
              examples:
                unresolved:
                  summary: Unresolved alert
                  value:
                    - id: 1
                      msg: "Temperature 10.0C is out of range [-10, 5]"
                      severity: warning
                      is_resolved: false
                      shipment_id: 1
                      reading_id: 3
                      created_at: "2026-03-29 10:15:00"
                resolved:
                  summary: Resolved alert
                  value:
                    - id: 1
                      msg: "Resolved"
                      severity: critical
                      is_resolved: true
                      shipment_id: 1
                      reading_id: 3
                      created_at: "2026-03-29 10:15:00"
        "404":
          description: Not found

  /shipments/{shipmentId}/alerts/{alertId}:
    parameters:
      - $ref: "#/components/parameters/ShipmentId"
      - $ref: "#/components/parameters/AlertId"

    get:
      tags: [Alerts]
      summary: Get alert
      description: Get an alert.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
              examples:
                unresolved:
                  summary: Unresolved alert
                  value:
                    id: 1
                    msg: "Temperature 10.0C is out of range [-10, 5]"
                    severity: warning
                    is_resolved: false
                    shipment_id: 1
                    reading_id: 3
                    created_at: "2026-03-29 10:15:00"
                resolved:
                  summary: Resolved alert
                  value:
                    id: 1
                    msg: "Resolved"
                    severity: critical
                    is_resolved: true
                    shipment_id: 1
                    reading_id: 3
                    created_at: "2026-03-29 10:15:00"
        "404":
          description: Not found

    put:
      tags: [Alerts]
      summary: Update alert
      description: Update an alert. Returns the updated alert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertInput"
            example:
              msg: Resolved
              severity: critical
              is_resolved: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
              example:
                id: 1
                msg: Resolved
                severity: critical
                is_resolved: true
                shipment_id: 1
                reading_id: 3
                created_at: "2026-03-29 10:15:00"
        "400":
          description: Bad request
        "404":
          description: Not found
        "415":
          description: Invalid content type

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Shipmenthub-Api-Key

  parameters:
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        type: integer

    ReadingId:
      name: readingId
      in: path
      required: true
      schema:
        type: integer

    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: integer

  schemas:

    Shipment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        origin:
          type: string
        destination:
          type: string
        status:
          type: string
        min_temperature:
          type: number
        max_temperature:
          type: number
        created_at:
          type: string

    ShipmentInput:
      type: object
      required:
        - name
        - origin
        - destination
      properties:
        name:
          type: string
        origin:
          type: string
        destination:
          type: string
        status:
          type: string
        min_temperature:
          type: number
        max_temperature:
          type: number

    ShipmentWithLinks:
      allOf:
        - $ref: "#/components/schemas/Shipment"
        - type: object
          properties:
            _links:
              type: object
              properties:
                self:
                  type: string
                readings:
                  type: string

    Reading:
      type: object
      properties:
        id:
          type: integer
        temp:
          type: number
        humidity:
          type: number
          nullable: true
        shipment_id:
          type: integer
        ts:
          type: string

    ReadingInput:
      type: object
      required:
        - temp
      properties:
        temp:
          type: number
        humidity:
          type: number
          nullable: true

    ReadingWithLinks:
      allOf:
        - $ref: "#/components/schemas/Reading"
        - type: object
          properties:
            _links:
              type: object
              properties:
                self:
                  type: string
                shipment:
                  type: string

    ReadingPostResponse:
      type: array
      description: Array containing the created reading and the alert (or null if no alert was triggered).
      items:
        nullable: true
      minItems: 2
      maxItems: 2

    Alert:
      type: object
      properties:
        id:
          type: integer
        msg:
          type: string
        severity:
          type: string
        is_resolved:
          type: boolean
        shipment_id:
          type: integer
        reading_id:
          type: integer
        created_at:
          type: string

    AlertInput:
      type: object
      properties:
        msg:
          type: string
        severity:
          type: string
        is_resolved:
          type: boolean