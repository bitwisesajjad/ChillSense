<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888780"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="#ffffff"/>

  <text x="490" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#000000">
    Screen workflow — client navigation
  </text>

  <!-- ROW 1: Entry, Dashboard, Map -->

  <!-- Entry -->
  <g transform="translate(60, 80)">
    <rect width="140" height="60" rx="4" ry="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
    <text x="70" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">Entry</text>
    <text x="70" y="46" text-anchor="middle" font-size="11" fill="#5F5E5A">user opens app</text>
  </g>

  <!-- Dashboard (index.html) -->
  <g transform="translate(330, 70)">
    <rect width="200" height="80" rx="4" ry="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">index.html</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#5F5E5A">Dashboard</text>
    <text x="100" y="58" text-anchor="middle" font-size="10" fill="#5F5E5A">summary bar + table</text>
    <text x="100" y="72" text-anchor="middle" font-size="10" fill="#5F5E5A">+ new shipment form</text>
  </g>

  <!-- Map (map.html) -->
  <g transform="translate(720, 70)">
    <rect width="200" height="80" rx="4" ry="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">map.html</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#5F5E5A">Map view</text>
    <text x="100" y="58" text-anchor="middle" font-size="10" fill="#5F5E5A">Leaflet routes</text>
    <text x="100" y="72" text-anchor="middle" font-size="10" fill="#5F5E5A">colored by status</text>
  </g>

  <!-- Arrow: Entry -> Dashboard -->
  <line x1="200" y1="110" x2="328" y2="110"
        stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="264" y="100" text-anchor="middle" font-size="10" fill="#5F5E5A">[1] load</text>

  <!-- Arrows: Dashboard <-> Map (top nav) - two parallel arrows with labels off the line -->
  <line x1="530" y1="100" x2="718" y2="100"
        stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="624" y="90" text-anchor="middle" font-size="10" fill="#5F5E5A">[2] click "Map"</text>

  <line x1="718" y1="130" x2="530" y2="130"
        stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="624" y="148" text-anchor="middle" font-size="10" fill="#5F5E5A">[3] click "Dashboard"</text>

  <!-- ROW 2: Shipment detail (single page, fed by both Dashboard and Map) -->
  <g transform="translate(430, 270)">
    <rect width="200" height="80" rx="4" ry="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">shipment.html?id=N</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#5F5E5A">Shipment detail</text>
    <text x="100" y="58" text-anchor="middle" font-size="10" fill="#5F5E5A">chart + readings + alerts</text>
    <text x="100" y="72" text-anchor="middle" font-size="10" fill="#5F5E5A">+ sensor simulator</text>
  </g>

  <!-- Arrow: Dashboard -> Shipment detail (down-right) -->
  <path d="M 460 150 L 460 220 L 510 220 L 510 268"
        stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text x="372" y="220" font-size="10" fill="#5F5E5A">[4] click row</text>
  <text x="372" y="234" font-size="10" fill="#5F5E5A">(name link / "View")</text>

  <!-- Arrow: Map -> Shipment detail (down-left) -->
  <path d="M 800 150 L 800 220 L 580 220 L 580 268"
        stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="244" font-size="10" fill="#5F5E5A">[5] click route popup</text>
  <text x="700" y="258" font-size="10" fill="#5F5E5A">"View detail →"</text>

  <!-- Arrow: Shipment detail -> Dashboard (back via breadcrumb).
       Path goes left from the page box, up the left margin, over to the bottom of the dashboard. -->
  <path d="M 430 305 L 270 305 L 270 170 L 360 170 L 360 150"
        stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text x="158" y="296" font-size="10" fill="#5F5E5A">[6] click breadcrumb</text>
  <text x="158" y="310" font-size="10" fill="#5F5E5A">("Dashboard")</text>

  <!-- ROW 3: In-page action panels.
       Each one is visually CHILD-OF a page using a thin dashed BRACKET (not a directional arrow). -->

  <!-- Dashboard's in-page actions (left, under index.html) -->
  <g transform="translate(80, 440)">
    <rect width="240" height="80" rx="4" ry="4" fill="#ffffff" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">In-page actions</text>
    <text x="120" y="44" text-anchor="middle" font-size="10" fill="#5F5E5A">Toggle "New shipment" form</text>
    <text x="120" y="60" text-anchor="middle" font-size="10" fill="#5F5E5A">Submit POST → refresh table</text>
  </g>
  <!-- Bracket connector from index.html bottom to its action panel.
       Routes down the left side, well clear of shipment.html (which spans x=430..630, y=270..350). -->
  <path d="M 430 150 L 430 200 L 340 200 L 340 410 L 200 410 L 200 438"
        stroke="#888780" stroke-width="0.8" fill="none" stroke-dasharray="4 3"/>
  <text x="206" y="424" font-size="10" font-style="italic" fill="#5F5E5A">belongs to</text>

  <!-- Shipment detail's in-page actions (center, under shipment.html) -->
  <g transform="translate(370, 440)">
    <rect width="320" height="80" rx="4" ry="4" fill="#ffffff" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="160" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">In-page actions</text>
    <text x="160" y="44" text-anchor="middle" font-size="10" fill="#5F5E5A">Resolve alert (PUT)</text>
    <text x="160" y="60" text-anchor="middle" font-size="10" fill="#5F5E5A">Send simulator reading (POST)</text>
  </g>
  <!-- Bracket connector from shipment.html bottom to its action panel -->
  <path d="M 530 350 L 530 438"
        stroke="#888780" stroke-width="0.8" fill="none" stroke-dasharray="4 3"/>
  <text x="536" y="396" font-size="10" font-style="italic" fill="#5F5E5A">belongs to</text>

  <!-- Map has no in-page actions for the rubric (the popup link counts as navigation, not an action) -->

  <!-- LEGEND / EXPLANATION PANEL -->

  <rect x="40" y="556" width="900" height="138" rx="4" ry="4"
        fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>

  <text x="56" y="578" font-size="12" font-weight="700" fill="#000000">Legend</text>

  <!-- Legend symbols -->
  <line x1="56" y1="596" x2="86" y2="596"
        stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="96" y="600" font-size="11" fill="#000000">solid arrow = user navigation between pages</text>

  <line x1="56" y1="616" x2="86" y2="616"
        stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="96" y="620" font-size="11" fill="#000000">dashed line = "belongs to" (action panel is part of the page above it)</text>

  <rect x="56" y="630" width="30" height="14" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="96" y="641" font-size="11" fill="#000000">solid box = HTML page (one file)</text>

  <rect x="56" y="650" width="30" height="14" rx="2" fill="#ffffff" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="96" y="661" font-size="11" fill="#000000">dashed box = in-page action panel (form, button, simulator)</text>

  <!-- Numbered arrow explanation (right side of legend) -->
  <text x="500" y="578" font-size="12" font-weight="700" fill="#000000">What each arrow means</text>

  <text x="500" y="598" font-size="11" fill="#000000">[1] User opens the app, lands on the dashboard.</text>
  <text x="500" y="614" font-size="11" fill="#000000">[2] Click "Map" in the top nav to jump to the map.</text>
  <text x="500" y="630" font-size="11" fill="#000000">[3] Click "Dashboard" in the top nav to go back.</text>
  <text x="500" y="646" font-size="11" fill="#000000">[4] Click a shipment row (or "View") to open its detail page.</text>
  <text x="500" y="662" font-size="11" fill="#000000">[5] Click a route popup on the map and follow "View detail →".</text>
  <text x="500" y="678" font-size="11" fill="#000000">[6] Click "Dashboard" in the breadcrumb to go back.</text>
</svg>
