<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shipment.js tests</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --surface: #fafafa;
        --border: #eaeaea;
        --text-primary: #000000;
        --text-secondary: #666666;
        --accent: #009966;
        --danger: #ee0000;
        --danger-light: #fff0f0;
      }
      body {
        font-family: 'Geist', system-ui, sans-serif;
        font-size: 14px;
        color: var(--text-primary);
        background: var(--bg);
        max-width: 800px;
        margin: 32px auto;
        padding: 0 16px;
      }
      h1 {
        font-weight: 600;
      }
      .summary {
        padding: 12px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 16px;
        font-family: 'Geist Mono', monospace;
      }
      .test {
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 6px;
        background: var(--surface);
      }
      .test.pass {
        border-left: 3px solid var(--accent);
      }
      .test.fail {
        border-left: 3px solid var(--danger);
        background: var(--danger-light);
      }
      .name {
        font-weight: 500;
      }
      .err {
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        color: var(--danger);
        margin-top: 6px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>shipment.js tests</h1>
    <div id="summary" class="summary">running...</div>
    <div id="results"></div>

    <script type="module">
      import {
        getShipmentIdFromUrl,
        buildChartData,
        pickSafeTemp,
        pickViolationTemp,
        formatTimestamp,
        renderShipmentInfo,
        renderReadingsTable,
        renderAlertsTable,
      } from '../shipment.js';

      const tests = [];
      function test(name, fn) {
        tests.push({ name, fn });
      }
      function assert(cond, msg) {
        if (!cond) throw new Error(msg || 'assertion failed');
      }
      function assertEqual(actual, expected, msg) {
        const a = JSON.stringify(actual);
        const e = JSON.stringify(expected);
        if (a !== e)
          throw new Error(
            (msg || 'not equal') + `\n  expected: ${e}\n  actual:   ${a}`
          );
      }

      //  getShipmentIdFromUrl

      test('getShipmentIdFromUrl parses ?id=5', () => {
        assertEqual(getShipmentIdFromUrl('?id=5'), 5);
      });

      test('getShipmentIdFromUrl returns null for empty query', () => {
        assertEqual(getShipmentIdFromUrl(''), null);
      });

      test('getShipmentIdFromUrl returns null for non-numeric id', () => {
        assertEqual(getShipmentIdFromUrl('?id=abc'), null);
      });

      //  buildChartData

      test('buildChartData labels match ts values', () => {
        const shipment = { min_temperature: -10, max_temperature: 5 };
        const readings = [
          { id: 1, temp: 0, ts: '2026-04-25 10:00:00' },
          { id: 2, temp: 1, ts: '2026-04-25 10:05:00' },
        ];
        const out = buildChartData(readings, shipment);
        assertEqual(out.labels, ['2026-04-25 10:00:00', '2026-04-25 10:05:00']);
        assertEqual(out.temps, [0, 1]);
      });

      test('buildChartData marks min violation as alert color', () => {
        const shipment = { min_temperature: -10, max_temperature: 5 };
        const readings = [
          { id: 1, temp: -20, ts: 't1' },
          { id: 2, temp: 0, ts: 't2' },
        ];
        const out = buildChartData(readings, shipment);
        assertEqual(out.pointColors.length, 2);
        assert(
          out.pointColors[0] !== out.pointColors[1],
          'colors should differ'
        );
      });

      test('buildChartData marks max violation as alert color', () => {
        const shipment = { min_temperature: -10, max_temperature: 5 };
        const readings = [{ id: 1, temp: 99, ts: 't1' }];
        const out = buildChartData(readings, shipment);
        // alert color is red, normal is the accent green. We just check it picked the alert one.
        assert(
          out.pointColors[0].toLowerCase().includes('ee') ||
            out.pointColors[0].toLowerCase().includes('red') ||
            out.pointColors[0] !== '#009966'
        );
      });

      test('buildChartData returns min and max threshold values', () => {
        const shipment = { min_temperature: -10, max_temperature: 5 };
        const readings = [{ id: 1, temp: 0, ts: 't1' }];
        const out = buildChartData(readings, shipment);
        assertEqual(out.minLine, -10);
        assertEqual(out.maxLine, 5);
      });

      //  pickSafeTemp / pickViolationTemp

      test('pickSafeTemp returns value inside the range', () => {
        const shipment = { min_temperature: -10, max_temperature: 5 };
        for (let i = 0; i < 20; i++) {
          const t = pickSafeTemp(shipment);
          assert(t >= -10 && t <= 5, `expected ${t} to be in [-10, 5]`);
        }
      });

      test('pickViolationTemp returns value outside the range', () => {
        const shipment = { min_temperature: -10, max_temperature: 5 };
        for (let i = 0; i < 20; i++) {
          const t = pickViolationTemp(shipment);
          assert(t < -10 || t > 5, `expected ${t} to be outside [-10, 5]`);
        }
      });

      //  formatTimestamp

      test('formatTimestamp returns string for valid input', () => {
        const out = formatTimestamp('2026-04-25 10:00:00');
        assert(typeof out === 'string' && out.length > 0);
      });

      test('formatTimestamp handles null', () => {
        const out = formatTimestamp(null);
        assert(typeof out === 'string');
      });

      //  renderReadingsTable

      function makeTbody() {
        const t = document.createElement('table');
        const tb = document.createElement('tbody');
        t.appendChild(tb);
        return tb;
      }

      test('renderReadingsTable orders newest first', () => {
        const tb = makeTbody();
        const readings = [
          { id: 1, temp: 0, humidity: 60, ts: '2026-04-25 10:00:00' },
          { id: 2, temp: 1, humidity: 60, ts: '2026-04-25 11:00:00' },
          { id: 3, temp: 2, humidity: 60, ts: '2026-04-25 09:00:00' },
        ];
        renderReadingsTable(tb, readings);
        const rows = tb.querySelectorAll('tr');
        assertEqual(rows.length, 3);
        // first row should be id=2 since it has the newest ts
        assert(
          rows[0].textContent.includes('2026-04-25 11:00:00'),
          'first row should be newest'
        );
      });

      test('renderReadingsTable empty state', () => {
        const tb = makeTbody();
        renderReadingsTable(tb, []);
        assertEqual(tb.querySelectorAll('tr').length, 1);
        assert(tb.textContent.toLowerCase().includes('no readings'));
      });

      //  renderAlertsTable

      test('renderAlertsTable shows resolve button only for unresolved', () => {
        const tb = makeTbody();
        const alerts = [
          {
            id: 1,
            msg: 'a',
            severity: 'warning',
            is_resolved: false,
            created_at: '2026-04-25 10:00:00',
          },
          {
            id: 2,
            msg: 'b',
            severity: 'warning',
            is_resolved: true,
            created_at: '2026-04-25 11:00:00',
          },
        ];
        renderAlertsTable(tb, alerts, () => {});
        const buttons = tb.querySelectorAll('.resolve-btn');
        assertEqual(buttons.length, 1);
      });

      test('renderAlertsTable resolve click calls callback with alert id', () => {
        const tb = makeTbody();
        const alerts = [
          {
            id: 42,
            msg: 'a',
            severity: 'warning',
            is_resolved: false,
            created_at: 't',
          },
        ];
        let received = null;
        renderAlertsTable(tb, alerts, id => {
          received = id;
        });
        const btn = tb.querySelector('.resolve-btn');
        btn.click();
        assertEqual(received, 42);
      });

      //  renderShipmentInfo

      test('renderShipmentInfo writes fields into elements', () => {
        const wrap = document.createElement('div');
        wrap.innerHTML = `
        <span id="info-name"></span>
        <span id="info-route"></span>
        <span id="info-status"></span>
        <span id="info-temp-range"></span>
        <span id="info-created"></span>
      `;
        renderShipmentInfo(wrap, {
          id: 1,
          name: 'Truck-001',
          origin: 'Berlin',
          destination: 'Munich',
          status: 'active',
          min_temperature: 2,
          max_temperature: 8,
          created_at: '2026-03-29 10:00:00',
        });
        assert(
          wrap.querySelector('#info-name').textContent.includes('Truck-001')
        );
        assert(
          wrap.querySelector('#info-route').textContent.includes('Berlin')
        );
        assert(
          wrap.querySelector('#info-route').textContent.includes('Munich')
        );
        assert(
          wrap.querySelector('#info-status').textContent.includes('active')
        );
      });

      //  run

      (async () => {
        const results = document.getElementById('results');
        let pass = 0,
          fail = 0;
        for (const t of tests) {
          const div = document.createElement('div');
          div.className = 'test';
          try {
            await t.fn();
            div.classList.add('pass');
            div.innerHTML = `<span class="name">✓ ${t.name}</span>`;
            pass++;
          } catch (e) {
            div.classList.add('fail');
            div.innerHTML = `<span class="name">✗ ${t.name}</span><div class="err">${e.message}</div>`;
            fail++;
          }
          results.appendChild(div);
        }
        const summary = document.getElementById('summary');
        summary.textContent = `${pass} passed, ${fail} failed (${tests.length} total)`;
        summary.style.color = fail === 0 ? 'var(--accent)' : 'var(--danger)';
      })();
    </script>
  </body>
</html>
